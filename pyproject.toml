[project]
name = "integration-sync-sketch"
version = "0.1.0"
description = "A study of the patterns behind syncing external systems (calendar, email, CRM, ticketing, HubSpot) into a unified store: idempotency, incremental cursors, conflict policy, retry with backoff, rate-limit handling, schema-drift tolerance, dead-lettering, a milestone risk layer, and an operational dashboard. Synthetic self-authored data, demo scope, not production."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "icalendar>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]
# The ops dashboard is the only thing that needs a UI framework, so it is kept out of the
# base install. The sync engine, the HubSpot connector, and the metrics module all work
# without it. `width="stretch"` on dataframes needs a recent streamlit.
dashboard = ["streamlit>=1.49,<2"]

[tool.setuptools.packages.find]
include = ["integration_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
